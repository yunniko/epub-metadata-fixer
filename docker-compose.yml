# No database — this service is stateless; every EPUB/image is processed
# entirely client-side in the browser, nothing is ever uploaded to a server.
services:
  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      ADSENSE_PUBLISHER_ID: ${ADSENSE_PUBLISHER_ID:-}
      # Paid batch mode (Stripe Checkout). All three must be set for the buy
      # button to appear; STRIPE_PRICE_ID is optional (inline price otherwise).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-}
    ports:
      - "127.0.0.1:30110:3000"
